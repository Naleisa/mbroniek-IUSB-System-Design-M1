# Publishes the project docs as web pages under /docs/ on GitHub Pages (T61).
# Built by actions/jekyll-build-pages in .github/workflows/deploy.yml.
title: CareMatch Docs
theme: jekyll-theme-primer
baseurl: /mbroniek-IUSB-System-Design-M1/docs

# Prompts and session notes stay in the repo only; Mike's build log (prompt-scratch/learned.md) is published.
exclude:
  - prompt-scratch/prompt-template
  - prompt-scratch/session-context-*
